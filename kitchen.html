<style>

*{
box-sizing:border-box;
}

body{
margin:0;

}

<body>


<header>

<h1>🇳🇵 Sasurali Ghar</h1>

<div class="header-info">
🍳 Kitchen Order Screen
</div>

</header>


<div class="container">


<button
id="soundButton"
class="sound-button"
onclick="enableSound()">

🔊 Enable Kitchen Sound

</button>


<div
id="soundStatus"
class="sound-status">

Sound is not enabled yet.

</div>


<button
class="refresh"
onclick="loadOrders()">

🔄 Refresh Orders

</button>


<div
id="errorBox"
class="error">
</div>


<div id="orders">

<div class="loading">
Loading orders...
</div>

</div>


</div>


<script>


/* =====================================
   SUPABASE CONNECTION
===================================== */

const SUPABASE_URL =
"https://naqxasgbfnjpamzjwkov.supabase.co";


const SUPABASE_KEY =
"sb_publishable_vKkQZFBvWPu1FBYiR3QCdQ_DlkzGJqj";


/* =====================================
   SOUND
===================================== */

let soundEnabled = false;

let knownOrderIds = new Set();

let firstLoad = true;


let audioContext = null;


function enableSound(){

try{

audioContext =
new (
window.AudioContext ||
window.webkitAudioContext
)();

if(audioContext.state === "suspended"){

audioContext.resume();

}

playTestSound();

soundEnabled = true;


document.getElementById(
"soundButton"
).textContent =
"🔊 Kitchen Sound Enabled";


document.getElementById(
"soundButton"
).classList.add(
"enabled"
);


document.getElementById(
"soundStatus"
).textContent =
"✅ Sound is enabled. New orders will ring.";


}catch(error){

console.error(error);

alert(
"Could not enable sound. Please check your browser settings."
);

}

}


function playTestSound(){

if(!audioContext){

return;

}


const oscillator =
audioContext.createOscillator();

const gain =
audioContext.createGain();


oscillator.connect(
gain
);

gain.connect(
audioContext.destination
);


oscillator.type =
"sine";

oscillator.frequency.value =
800;


gain.gain.setValueAtTime(
0.001,
audioContext.currentTime
);

gain.gain.exponentialRampToValueAtTime(
0.5,
audioContext.currentTime + 0.02
);

gain.gain.exponentialRampToValueAtTime(
0.001,
audioContext.currentTime + 0.5
);


oscillator.start();

oscillator.stop(
audioContext.currentTime + 0.5
);

}


function playNewOrderSound(){

if(!soundEnabled){

return;

}


if(!audioContext){

return;

}


if(audioContext.state === "suspended"){

audioContext.resume();

}


const now =
audioContext.currentTime;


for(let i=0;i<3;i++){

const oscillator =
audioContext.createOscillator();

const gain =
audioContext.createGain();


oscillator.connect(
gain
);

gain.connect(
audioContext.destination
);


oscillator.type =
"sine";


oscillator.frequency.value =
i % 2 === 0
? 900
: 650;


gain.gain.setValueAtTime(
0.001,
now + i * 0.35
);

gain.gain.exponentialRampToValueAtTime(
0.7,
now + i * 0.35 + 0.03
);

gain.gain.exponentialRampToValueAtTime(
0.001,
now + i * 0.35 + 0.3
);


oscillator.start(
now + i * 0.35
);

oscillator.stop(
now + i * 0.35 + 0.3
);

}

}


/* =====================================
   LOAD ORDERS
===================================== */

async function loadOrders(){

const ordersBox =
document.getElementById(
"orders"
);

const errorBox =
document.getElementById(
"errorBox"
);


errorBox.style.display =
"none";


try{


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/orders?select=*&order=created_at.desc",

{

method:"GET",

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
SUPABASE_KEY

}

}

);


if(!response.ok){

const error =
await response.text();

console.error(error);

errorBox.textContent =
"❌ Could not load orders.";

errorBox.style.display =
"block";

return;

}


const orders =
await response.json();


/* =====================================
   CHECK FOR NEW ORDERS
===================================== */

if(!firstLoad){

let newOrderFound =
false;


orders.forEach(order=>{

if(
!knownOrderIds.has(
String(order.id)
)
&&
order.status==="new"
){

newOrderFound =
true;

}

});


if(newOrderFound){

playNewOrderSound();

}

}


/* Save known order IDs */

knownOrderIds =
new Set(
orders.map(
order=>String(order.id)
)
);


firstLoad =
false;


displayOrders(
orders
);


}catch(error){

console.error(error);

errorBox.textContent =
"❌ Connection error.";

errorBox.style.display =
"block";

}

}


/* =====================================
   DISPLAY ORDERS
===================================== */

function displayOrders(
orders
){

const box =
document.getElementById(
"orders"
);


if(orders.length===0){

box.innerHTML = `

<div class="empty">

🍽️ No orders yet.

</div>

`;

return;

}


box.innerHTML =
"";


orders.forEach(
order=>{


const card =
document.createElement(
"div"
);


card.className =
"order-card";


if(order.status==="new"){

card.classList.add(
"new-order"
);

}


let statusClass =
"status-new";

let statusText =
"NEW";


if(
order.status==="preparing"
){

statusClass =
"status-preparing";

statusText =
"PREPARING";

}


if(
order.status==="completed"
){

statusClass =
"status-completed";

statusText =
"COMPLETED";

}


let itemsHTML =
"";


if(
Array.isArray(
order.order_items
)
){

order.order_items.forEach(
item=>{

itemsHTML += `

<div class="item-row">

<div class="item-name">

${escapeHTML(
item.name
)}

 × ${item.quantity}

</div>

<div class="item-price">

¥${item.price * item.quantity}

</div>

</div>

`;

});

}


let customer =
order.customer_name ||
"Not provided";


let spice =
order.spice_level ||
"Normal Spicy";


let created =
formatTime(
order.created_at
);


card.innerHTML = `

<div class="order-top">

<div>

<div class="table">

🪑 ${escapeHTML(
order.table_number ||
"Unknown"
)}

</div>

<div class="order-time">

${created}

</div>

</div>


<div class="status ${statusClass}">

${statusText}

</div>

</div>


<div class="items">

${itemsHTML}

</div>


<div class="details">

<div class="detail-row">

👤 <strong>Customer:</strong>
${escapeHTML(
customer
)}

</div>


<div class="detail-row">

🌶️ <strong>Spice:</strong>
${escapeHTML(
spice
)}

</div>

</div>


<div class="total">

Total: ¥${order.total}

</div>


<div class="buttons">


${
order.status==="new"
?

`

<button
class="prepare"
onclick="changeStatus(
'${order.id}',
'preparing'
)">

👨‍🍳 Preparing

</button>

`

:

""

}


${
order.status==="preparing"
?

`

<button
class="complete"
onclick="changeStatus(
'${order.id}',
'completed'
)">

✅ Completed

</button>

`

:

""

}


${
order.status==="completed"
?

`

<button
class="complete"
disabled>

✅ Completed

</button>

`

:

""

}


</div>

`;


box.appendChild(
card
);

});

}


/* =====================================
   CHANGE STATUS
===================================== */

async function changeStatus(
id,
newStatus
){

try{


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/orders?id=eq." +
encodeURIComponent(id),

{

method:"PATCH",

headers:{

"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
SUPABASE_KEY,

"Prefer":
"return=minimal"

},

body:
JSON.stringify({

status:
newStatus

})

}

);


if(!response.ok){

const error =
await response.text();

console.error(error);

alert(
"Could not update order."
);

return;

}


loadOrders();


}catch(error){

console.error(error);

alert(
"Connection error."
);

}

}


/* =====================================
   TIME
===================================== */

function formatTime(
dateString
){

if(!dateString){

return "";

}


const date =
new Date(
dateString
);


return date.toLocaleString(
"en-JP",
{

year:"numeric",

month:"short",

day:"numeric",

hour:"2-digit",

minute:"2-digit"

}

);

}


/* =====================================
   SECURITY
===================================== */

function escapeHTML(
value
){

return String(
value
)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}


/* =====================================
   START
===================================== */

loadOrders();


/*
   Check for new orders every 5 seconds.
*/

setInterval(
loadOrders,
5000
);


</script>


</body>
</html>
